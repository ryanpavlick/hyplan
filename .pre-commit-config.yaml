# Pre-commit hooks.  Install once per clone with:
#
#     pip install pre-commit
#     pre-commit install
#
# Hooks run on `git commit` and block the commit if any fail.
# The ruff invocation matches the CI lint step in
# .github/workflows/tests.yml so anything that lands in main has
# already been linted locally.
#
# To run hooks on the whole tree (e.g. after pulling new config):
#
#     pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        # Match CI's invocation: hyplan/, tests/, and notebooks/.
        # Native Ruff notebook support is enabled via
        # [tool.ruff] extend-include = ["*.ipynb"]; per-file-ignores
        # at [tool.ruff.lint.per-file-ignores] cover notebook-appropriate
        # relaxations (E402, E701, E702, B007, F811, F841).
        files: ^(hyplan|tests|notebooks)/.*\.(py|ipynb)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
