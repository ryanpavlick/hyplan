name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0)'
        required: true

permissions:
  contents: write
  # `actions: write` lets the final steps below dispatch publish.yml
  # and post-release.yml via `gh workflow run`.  Without that fan-out
  # those downstream workflows never fire: this workflow's
  # GITHUB_TOKEN-pushed tag and GITHUB_TOKEN-created GitHub Release
  # both fail to satisfy GitHub Actions' anti-recursion rule for
  # the `push: tags` and `release: published` triggers, so the chain
  # used to silently break (v1.7.0 and v1.8.0 both shipped without
  # SECURITY.md / PyPI housekeeping firing automatically).
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Backstop: refuse to tag a red main.  Mirrors the lint /
      # type-check / test steps in tests.yml; pre-commit + a local
      # ``pytest`` run are the primary defenses for the maintainer.
      # The matrix coverage (3.10 / 3.11 / 3.12) still lives in
      # tests.yml — we only re-run the 3.11 check here as a fast
      # last-chance gate before tagging.
      - name: Install verification deps
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install "numpy>=2.0,<2.3" "pint>=0.24,<0.26"
          pip install pytest pytest-cov ruff==0.15.12 mypy
      - name: Lint (ruff)
        run: ruff check hyplan tests
      - name: Type check (mypy)
        run: mypy hyplan
      - name: Tests (pytest)
        run: pytest tests/ -q

      - name: Update CITATION.cff version
        run: |
          VERSION=${{ github.event.inputs.version }}
          sed -i "s/^version: .*/version: ${VERSION}/" CITATION.cff
          echo "Updated CITATION.cff to version ${VERSION}"

      - name: Commit and tag
        run: |
          VERSION=${{ github.event.inputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CITATION.cff
          git commit -m "Release v${VERSION}"
          # The `v` prefix is load-bearing — post-release.yml only
          # triggers on `v[0-9]+.[0-9]+.[0-9]+` tags.
          git tag "v${VERSION}"
          git push origin main --tags

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION=${{ github.event.inputs.version }}
          # Extract the section for this version (between ## vX.Y.Z [...]
          # and the next ## or EOF).  The header line typically carries a
          # trailing em-dash + date, e.g. ``## v1.6.3 — 2026-05-11``, so
          # the match anchor is "start of line + ## vX.Y.Z" followed by
          # any of: end-of-line, space, or tab.
          awk "/^## v${VERSION}([ \\t]|\$)/{found=1; next} /^## /{if(found) exit} found{print}" CHANGELOG.md > /tmp/release_notes.md
          n=$(wc -l < /tmp/release_notes.md)
          echo "Extracted ${n} lines of release notes"
          if [ "${n}" -lt 5 ]; then
            echo "::error::Release notes for v${VERSION} are suspiciously short (${n} lines).  Check the CHANGELOG header format."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ github.event.inputs.version }}
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file /tmp/release_notes.md

      # ----------------------------------------------------------------
      # Fan-out: explicitly dispatch downstream workflows.
      #
      # Why: GitHub Actions refuses to fire `push: tags` and
      # `release: published` triggers when the tag / release is created
      # by another workflow using GITHUB_TOKEN.  This means publish.yml
      # and post-release.yml — which would otherwise fire automatically
      # on the tag + release we just created — silently stay idle.
      # `gh workflow run` against `workflow_dispatch` triggers IS allowed
      # (with `actions: write`), so we fan out explicitly here.
      #
      # If either dispatch fails the release commit + tag + GitHub
      # Release are already on origin; the maintainer can re-dispatch
      # manually from the Actions tab without re-running release.yml.
      # ----------------------------------------------------------------
      - name: Dispatch publish.yml (PyPI publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ github.event.inputs.version }}
          gh workflow run publish.yml -f tag="v${VERSION}"
          echo "Dispatched publish.yml for v${VERSION}"

      - name: Dispatch post-release.yml (SECURITY.md / CITATION.cff housekeeping)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ github.event.inputs.version }}
          gh workflow run post-release.yml -f tag="v${VERSION}"
          echo "Dispatched post-release.yml for v${VERSION}"
