name: Post-release housekeeping

# Triggers on every released tag (vX.Y.Z, no pre-release suffix)
# and bumps two files on main:
#
#   * SECURITY.md "Supported versions" table — regenerated from the
#     full set of release tags; new minor X.Y.x is the supported
#     line, earlier 1.x minors get a "use X.Y.x" pointer.
#   * CITATION.cff "version:" field — set to the bare X.Y.Z.
#
# A single commit covers both files.  No commit is made if neither
# file changed (e.g. when release.yml already bumped CITATION.cff
# before tagging).
#
# Triggers:
#   * push: tags — the normal path when a maintainer pushes a tag
#     manually from their workstation.
#   * workflow_dispatch (tag input) — release.yml fans out to this
#     workflow at the end of its run, because tags pushed by a
#     workflow's GITHUB_TOKEN do NOT fire other workflows' push: tags
#     triggers (GitHub Actions anti-recursion policy).  Without this
#     fallback the SECURITY.md table goes stale every release that's
#     cut by release.yml — which is every release after v1.6.x.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to housekeep for (e.g. v1.8.0)"
        required: true

permissions:
  contents: write

jobs:
  # Backstop: re-run the same lint check the Tests CI workflow does,
  # so a tag pushed against a red main fails fast instead of silently
  # bumping SECURITY.md / CITATION.cff for a broken release.
  verify-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # On push:tags `github.ref` resolves to the tag ref so this
          # lints the tagged content.  On workflow_dispatch we explicitly
          # check out the dispatched tag instead.
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.15.12
      - name: Lint (ruff)
        run: ruff check hyplan tests

  post-release:
    needs: verify-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0  # need tags + history for table generation

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate SECURITY.md supported-versions table
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python <<'PY'
          import os, re, subprocess

          version = os.environ["TAG"].lstrip("v")
          major, minor, _patch = version.split(".")
          supported_minor = f"{major}.{minor}"
          supported_label = f"{supported_minor}.x"

          # Enumerate all release tags (X.Y.Z, with or without "v"
          # prefix — early HyPlan releases were unprefixed).  Skip
          # pre-release suffixes.
          out = subprocess.check_output(["git", "tag"], text=True)
          tag_re = re.compile(r"^v?(\d+)\.(\d+)\.(\d+)$")
          tags = [m.group(0).lstrip("v") for line in out.split()
                  if (m := tag_re.match(line))]
          minors = {f"{t.split('.')[0]}.{t.split('.')[1]}" for t in tags}
          minors.add(supported_minor)
          minors_sorted = sorted(
              minors, key=lambda x: tuple(int(p) for p in x.split(".")), reverse=True
          )
          # Pre-1.0 minors collapse into the "< 1.0" catch-all row.
          minors_sorted = [m for m in minors_sorted if int(m.split(".")[0]) >= 1]

          rows = [
              "| Version  | Supported          |",
              "|----------|--------------------|",
          ]
          for m in minors_sorted:
              label = f"{m}.x"
              if m == supported_minor:
                  rows.append(f"| {label:<8} | :white_check_mark: |")
              elif m.startswith("1."):
                  rows.append(f"| {label:<8} | :x: (use {supported_label})    |")
              else:
                  rows.append(f"| {label:<8} | :x:                |")
          rows.append("| < 1.0    | :x:                |")
          new_table = "\n".join(rows) + "\n"

          with open("SECURITY.md") as f:
              content = f.read()

          # Match the existing table: header row + separator + 1+ data rows.
          pattern = re.compile(
              r"\| Version  \| Supported          \|\n"
              r"\|----------\|--------------------\|\n"
              r"(?:\|.*\|\n)+",
              re.MULTILINE,
          )
          if not pattern.search(content):
              raise SystemExit("Could not locate supported-versions table in SECURITY.md")

          new_content = pattern.sub(new_table, content, count=1)
          if new_content == content:
              print("SECURITY.md already up to date.")
          else:
              with open("SECURITY.md", "w") as f:
                  f.write(new_content)
              print(f"SECURITY.md updated for {supported_label}.")
          PY

      - name: Bump CITATION.cff version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION=${TAG#v}
          # POSIX sed: match ^version: ... and replace.
          sed -i "s/^version: .*/version: ${VERSION}/" CITATION.cff
          echo "CITATION.cff version set to ${VERSION}."

      - name: Commit and push
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if git diff --quiet -- SECURITY.md CITATION.cff; then
            echo "No post-release changes; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SECURITY.md CITATION.cff
          git commit -m "post-release: bump SECURITY.md + CITATION.cff for ${TAG}"
          git push origin main
