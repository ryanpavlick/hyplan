name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov ruff mypy

      - name: Lint (ruff)
        run: ruff check hyplan tests

      - name: Type check (mypy)
        # As of v1.4 the codebase is mypy-clean.  Failures here block
        # the build so future PRs can't introduce new type errors.
        run: mypy hyplan

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=hyplan --cov-report=term-missing --cov-fail-under=60
