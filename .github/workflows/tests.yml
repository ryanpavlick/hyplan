name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          # Pin numpy + pint to keep mypy stub behavior consistent
          # across the Python 3.9 / 3.11 / 3.12 matrix.  Without
          # these pins, pip resolves different numpy / pint versions
          # per Python (newer numpy 2.x is 3.10+ only; older pint
          # bundles different stubs), and mypy reports load-bearing
          # `# type: ignore` comments as unused on one Python and
          # required on another.  See the v1.4.1 CHANGELOG entry
          # for the regression that prompted these pins.
          pip install "numpy>=1.26,<2.3" "pint>=0.24,<0.26"
          pip install pytest pytest-cov ruff mypy

      - name: Lint (ruff)
        run: ruff check hyplan tests

      - name: Type check (mypy)
        # As of v1.4 the codebase is mypy-clean.  Failures here block
        # the build so future PRs can't introduce new type errors.
        run: mypy hyplan

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=hyplan --cov-report=term-missing --cov-fail-under=60
