name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          # Pin numpy + pint to keep mypy stub behavior consistent
          # across the Python 3.10 / 3.11 / 3.12 matrix.  Without
          # these pins, pip resolves different versions per Python
          # and mypy reports load-bearing `# type: ignore` comments
          # as unused on one Python and required on another.  See
          # the v1.4.1 CHANGELOG entry for the regression that
          # prompted these pins.  numpy upper bound was tightened
          # for 3.9 compatibility; with 3.9 dropped in v1.6 it can
          # now move toward >=2.0 as the stubs continue to settle.
          pip install "numpy>=2.0,<2.3" "pint>=0.24,<0.26"
          pip install pytest pytest-cov ruff mypy

      - name: Lint (ruff)
        run: ruff check hyplan tests

      - name: Type check (mypy)
        # As of v1.4 the codebase is mypy-clean.  Failures here block
        # the build so future PRs can't introduce new type errors.
        run: mypy hyplan

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=hyplan --cov-report=xml --cov-report=term-missing --cov-fail-under=60

      - name: Upload coverage to Codecov
        # Only upload from one matrix entry to avoid noise; 3.11 is the
        # primary development target.  fail_ci_if_error=false because
        # a Codecov outage shouldn't block CI.
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
