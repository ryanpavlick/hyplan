# Notebook CI manifest.
#
# Source of truth for which notebooks run under which CI tier and what
# they need to install / access to succeed. Consumed by
# `.github/notebooks/build_matrix.py` to produce the GitHub Actions
# matrix for `.github/workflows/notebooks.yml`.
#
# Schema per entry:
#   name:       file name under notebooks/ (or notebooks/calibration/)
#   extras:     pyproject extras to install for this notebook (notebooks
#               extra is always added)
#   requires:   auth secrets needed; entries here cause the notebook to
#               be skipped in CI cells where the secret isn't set.
#               Recognised tokens: earthdata, openaip, gee.
#   group:      "tutorial" | "auth" | "calibration".  Tutorial entries
#               run on the nightly tier; auth entries run only when
#               their requires: secrets are present; calibration runs
#               only on workflow_dispatch with include_calibration=true.
#
# When adding a notebook: bump this file, not the workflow.

notebooks:

