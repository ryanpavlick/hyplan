[build-system]
requires = ["setuptools>=64", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "hyplan"
dynamic = ["version"]
description = "Planning software for airborne remote sensing science campaigns"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    {name = "Ryan Pavlick", email = "ryan.p.pavlick@nasa.gov"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "geopandas",
    "numpy",
    "pandas",
    "pint",
    "rasterio",
    "pymap3d",
    "pyproj",
    "requests",
    "rtree",
    "shapely",
    "simplekml",
    "skyfield",
    "timezonefinder",
    "folium",
    "gpxpy",
    "matplotlib",
    "networkx",
    "xlsxwriter",
]

[project.optional-dependencies]
mag = ["geomag"]
clouds = ["earthengine-api"]
phenology = ["earthaccess", "xarray"]
winds = ["xarray", "netcdf4", "earthaccess", "pydap", "cfgrib"]
adsb = ["traffic>=2.8"]
planned = ["openpyxl", "pdfplumber"]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/ryanpavlick/hyplan"
Documentation = "https://ryanpavlick.github.io/hyplan/"
Repository = "https://github.com/ryanpavlick/hyplan"
Issues = "https://github.com/ryanpavlick/hyplan/issues"

[tool.setuptools.packages.find]
include = ["hyplan*"]

[tool.setuptools]
license-files = ["LICENSE.md"]

[tool.setuptools.package-data]
hyplan = ["py.typed", "data/*.geojson", "data/*.bsp"]

[tool.setuptools_scm]
version_file = "hyplan/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = []

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# Numpy stubs got stricter — np.empty/np.zeros assignments without an
# explicit dtype-typed target now require a type annotation.  These
# fire on pre-existing code; suppress until we add NDArray annotations.
disable_error_code = ["var-annotated"]

# timezonefinder ships match-statement syntax (Python 3.10+) in its
# implementation; mypy with python_version=3.9 can't parse it.  Skip
# its source rather than descend into it.
[[tool.mypy.overrides]]
module = "timezonefinder.*"
follow_imports = "skip"

# pint's stubs vary across versions (newer numpy stub interactions
# return PlainQuantity[Any] rather than the alias Quantity, breaking
# assignment/arg-type/return-value checks across the codebase).
# Skip pint imports entirely so Quantity is treated as Any.
[[tool.mypy.overrides]]
module = "pint.*"
follow_imports = "skip"

[tool.coverage.run]
source = ["hyplan"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 60
