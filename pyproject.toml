[build-system]
requires = ["setuptools>=64", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "hyplan"
dynamic = ["version"]
description = "Planning software for airborne remote sensing science campaigns"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "Ryan Pavlick", email = "ryan.p.pavlick@nasa.gov"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "geopandas",
    "numpy",
    "pandas",
    "pint",
    "rasterio",
    "pymap3d",
    "pyproj",
    "requests",
    "rtree",
    "shapely",
    "simplekml",
    "skyfield",
    "timezonefinder",
    "folium",
    "gpxpy",
    "matplotlib",
    "networkx",
    "xlsxwriter",
]

[project.optional-dependencies]
mag = ["geomag"]
clouds = ["earthengine-api"]
phenology = ["earthaccess", "xarray"]
winds = ["xarray", "netcdf4", "earthaccess", "pydap", "cfgrib"]
adsb = ["traffic>=2.8"]
planned = ["openpyxl", "pdfplumber"]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]
# Docs build tooling — installed by docs.yml. Keep in sync with the
# `pip install` step there until both are replaced by `pip install -e .[docs]`.
docs = ["sphinx>=7", "myst-nb", "furo", "sphinx-autodoc-typehints"]
# Notebook execution tooling only — papermill / ipykernel / jupyter /
# nbconvert. Does NOT include science-stack extras any individual
# notebook might need (winds, clouds, mag, planned, ...); those are
# declared per-notebook in `.github/notebooks/manifest.yml` and
# installed per matrix row.
notebooks = ["papermill", "ipykernel", "jupyter", "nbconvert"]

[project.urls]
Homepage = "https://github.com/ryanpavlick/hyplan"
Documentation = "https://ryanpavlick.github.io/hyplan/"
Repository = "https://github.com/ryanpavlick/hyplan"
Issues = "https://github.com/ryanpavlick/hyplan/issues"

[tool.setuptools.packages.find]
include = ["hyplan*"]

[tool.setuptools]
license-files = ["LICENSE.md"]

[tool.setuptools.package-data]
hyplan = ["py.typed", "data/*.geojson", "data/*.bsp", "data/aircraft/*.json"]

[tool.setuptools_scm]
version_file = "hyplan/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = []
markers = [
    "perf: performance regression gates (timing-sensitive; may flake on noisy runners)",
]

[tool.ruff]
target-version = "py310"
# Native notebook linting (Ruff has stable .ipynb support since 0.6).
# Per-file-ignores below pick the notebook-appropriate rule relaxations.
extend-include = ["*.ipynb"]

[tool.ruff.lint]
# Default ruff includes E (pycodestyle errors) and F (pyflakes).
# Curated set of opt-in rules that catch real bugs.  Stylistic
# rule sets (full SIM/RET/RUF/UP) are queued for a separate pass —
# see TODO.md.
extend-select = [
    "B",    # flake8-bugbear (real bug-class issues)
    "SIM115",  # open() without context manager (file-leak risk)
    "UP",   # pyupgrade (PEP 585 generics, PEP 604 unions, etc.)
]
# B017 — test_radar uses pytest.raises(Exception) intentionally for
#        broad-stack-trace assertions.
# B008 — pint Quantity defaults like `ureg.feet` are common across
#        the aircraft API; flagging them all is noisy.
# B023 — function-uses-loop-variable: 2 sites in isochrone.py use
#        the closure intentionally; verify before fixing.
# B018 — 1 site in dubins3d.py is intentional XXX-debugging code.
# B905 — zip-without-explicit-strict: ~40 sites; pure stylistic, low
#        value to enforce in CI.
# B007 — already fixed; keep enabled.
# B904 — already fixed; keep enabled.
ignore = ["B017", "B008", "B023", "B018", "B905"]

[tool.ruff.lint.per-file-ignores]
# Package surface re-exports use `from .x import y` patterns that ruff
# can't distinguish from accidental unused imports.  The package surface
# also conditionally imports optional deps after try/except blocks,
# which trips E402 (imports not at top).  Both are intentional.
"hyplan/__init__.py" = ["E402", "F401"]
"hyplan/*/__init__.py" = ["F401"]
"hyplan/*/*/__init__.py" = ["F401"]
# Backward-compat shim that re-exports private helpers under the old
# module path so existing callers keep working.
"hyplan/flight_plan.py" = ["F401"]
# Tests group imports under section-comment headers near the bottom of
# the file (E402) and import optional deps inside try blocks to skip
# tests when the dep is missing (F401).
"tests/*.py" = ["E402", "F401"]
# Calibration helpers in notebooks/ insert their parent dir on sys.path
# before importing the shared `_common` module, which trips E402.  Same
# intentional pattern as the package-surface __init__.py files above.
"notebooks/calibration/**/*.py" = ["E402"]
# Jupyter notebooks legitimately keep cells self-contained — imports
# appear next to the code that uses them (E402), one-line `if x: ...`
# conditionals are common (E701/E702), unused loop variables in
# exploration cells aren't worth chasing (B007), and re-imports across
# cells produce false-positive F811s.  Also tolerate F841 unused-var
# leftovers in cell scopes.  F401 unused-import is tolerated in
# tutorials because notebooks sometimes import a symbol to demonstrate
# the import path even when the cell body doesn't reference it.
"notebooks/**/*.ipynb" = ["E402", "E701", "E702", "B007", "F401", "F811", "F841"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# pint's stubs vary across versions (newer numpy stub interactions
# return PlainQuantity[Any] rather than the alias Quantity, breaking
# assignment/arg-type/return-value checks across the codebase).
# Skip pint imports entirely so Quantity is treated as Any.
[[tool.mypy.overrides]]
module = "pint.*"
follow_imports = "skip"

# Strict mypy on the two newest planner modules.
[[tool.mypy.overrides]]
module = "hyplan.planning.isochrone"
strict = true

[[tool.mypy.overrides]]
module = "hyplan.aircraft.wind_path"
strict = true

[tool.coverage.run]
source = ["hyplan"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 60
